# 通用环境
version: '3.0'

networks:
  test:
    driver: bridge

services:
 #mysql环境# https://github.com/bitnami/containers/tree/main/bitnami/mysql#how-to-use-this-image
  mysql:
    image: bitnami/mysql:8.0
    container_name: test-mysql
    hostname: mysql
    privileged: true
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      # 这里123456改成自己的密码
      MYSQL_ROOT_PASSWORD: "123456"
    volumes:
      - "/docker-env/mysql/data:/bitnami/mysql/data"
      - "/docker-env/mysql/conf:/opt/bitnami/mysql/conf"
    networks:
      - test
    healthcheck:
      test: [ 'CMD', '/opt/bitnami/scripts/mysql/healthcheck.sh' ]
      interval: 10s
      timeout: 5s
      retries: 6

 #etcd环境# https://github.com/bitnami/containers/tree/main/bitnami/etcd
  etcd:
    hostname: etcd
    image: bitnami/etcd:3.5
    container_name: test-etcd
    privileged: true
    volumes:
      - "/docker-env/etcd/data:/bitnami/etcd/data"
      - "/docker-env/etcd/conf:/opt/bitnami/etcd/conf"
    environment:
    # 时区设置
      - TZ=Asia/Shanghai
    # 允许无认证访问
      - ALLOW_NONE_AUTHENTICATION=yes
    # etcd 客户端访问URL
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - test
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
 # etcd web管理工具 暴露端口 8099
  etcdkeeper:
    hostname: etcdkeeper
    image: evildecay/etcdkeeper:v0.7.6
    container_name: test-etcdkeeper
    ports:
      - "8099:8080"
    environment:
      - ETCD_ENDPOINT=http://etcd:2379
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      - test

 # postgres环境

 #redis环境 # https://github.com/bitnami/containers/tree/main/bitnami/redis
  redis:
    image: bitnami/redis:7.0
    container_name: test-redis
    hostname: redis
    privileged: true
    environment:
      - REDIS_PASSWORD="123456"
    ports:
      - "26379:6379"
    volumes:
      - "/docker-env/redis/data:/bitnami/redis/data"
      - "/docker-env/redis/conf:/opt/bitnami/redis/etc"
    networks:
      - test

 # kafka环境(单机) # https://github.com/bitnami/containers/tree/main/bitnami/kafka
  kafka:
    image: bitnami/kafka:3.9
    container_name: test-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    volumes:
      - "/docker-env/kafka/data:/bitnami/kafka/data"
      - "/docker-env/kafka/conf:/opt/bitnami/kafka/conf"
    networks:
      - test
